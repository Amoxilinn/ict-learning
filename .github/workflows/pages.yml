name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and validate
        run: |
          python3 build.py
          python3 scripts/audit_content.py
          python3 scripts/validate_glossary.py
          python3 scripts/test_validators.py
          python3 -m py_compile build.py scripts/audit_content.py scripts/validate_rewrite.py scripts/merge_rewrite.py scripts/make_batches_final.py
          node --check dist/app.js
          node --check dist/diagrams.js
          node --check dist/teaching.js
          node scripts/render_check.cjs
          node test-models.cjs
          node test-teaching.cjs
          node scripts/test-expanded.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
